[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "marker-mate"
dynamic = ["version"]
description = "Log timestamp markers while recording in OBS"
authors = [{ name = "slothmock" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "obsws_python",
    "keyboard",
    "appdirs",
]

[project.scripts]
marker-mate = "main:main"
